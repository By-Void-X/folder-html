<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeen1146 | Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e5e5e5; padding: 40px 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #3b82f6; margin-bottom: 20px; object-fit: cover; }
        h1 { font-size: 2rem; margin-bottom: 10px; background: linear-gradient(135deg, #fff, #3b82f6); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .bio { color: #888; margin-bottom: 20px; }
        .stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 40px; flex-wrap: wrap; }
        .stat-card { background: #1a1a1a; padding: 12px 24px; border-radius: 40px; border: 1px solid #333; }
        .stat-number { font-size: 1.8rem; font-weight: bold; color: #3b82f6; }
        .stat-label { font-size: 0.8rem; color: #888; }
        .controls { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; margin-bottom: 30px; }
        .search-box input { padding: 12px 20px; background: #1a1a1a; border: 1px solid #333; border-radius: 40px; color: white; width: 250px; outline: none; }
        .search-box input:focus { border-color: #3b82f6; }
        .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-btn { background: #1a1a1a; border: 1px solid #333; padding: 8px 20px; border-radius: 40px; color: #ccc; cursor: pointer; }
        .filter-btn.active, .filter-btn:hover { background: #3b82f6; color: white; border-color: #3b82f6; }
        .info-bar { background: #111; border-radius: 16px; padding: 12px 20px; margin-bottom: 24px; display: flex; justify-content: space-between; flex-wrap: wrap; font-size: 0.85rem; color: #888; border: 1px solid #333; }
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-top: 20px; }
        .project-card { background: #111; border: 1px solid #333; border-radius: 20px; padding: 20px; transition: 0.2s; }
        .project-card:hover { border-color: #3b82f6; transform: translateY(-3px); }
        .project-name { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
        .project-name a { color: white; text-decoration: none; }
        .project-name a:hover { color: #3b82f6; }
        .project-desc { color: #999; font-size: 0.85rem; margin: 10px 0; line-height: 1.5; }
        .tech-tag { background: #1e1e1e; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; color: #3b82f6; display: inline-block; margin-right: 6px; margin-bottom: 6px; border: 1px solid #2a2a2a; cursor: pointer; }
        .tech-tag:hover { background: #3b82f6; color: white; }
        .project-stats { display: flex; gap: 15px; margin-top: 12px; font-size: 0.75rem; color: #666; }
        .file-list { margin-top: 15px; border-top: 1px solid #2a2a2a; padding-top: 12px; }
        .file-list h4 { font-size: 0.75rem; color: #888; margin-bottom: 8px; }
        .file-item { display: inline-block; background: #1a1a1a; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; margin: 3px; cursor: pointer; }
        .file-item:hover { background: #3b82f6; color: white; }
        .loading, .error { text-align: center; padding: 60px; color: #888; }
        .error { color: #ef4444; }
        footer { text-align: center; margin-top: 50px; padding-top: 30px; border-top: 1px solid #2a2a2a; color: #666; font-size: 0.8rem; }
        footer a { color: #3b82f6; text-decoration: none; }
        @media (max-width: 640px) {
            .controls { flex-direction: column; }
            .search-box input { width: 100%; }
            .projects-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img class="avatar" id="avatar" src="https://avatars.githubusercontent.com/u/186116108?v=4" alt="avatar">
        <h1 id="username">Zeen1146</h1>
        <p class="bio" id="bio">Developer | Full-stack Creator</p>
        <div class="stats">
            <div class="stat-card"><div class="stat-number" id="repoCount">2</div><div class="stat-label">Repositori</div></div>
            <div class="stat-card"><div class="stat-number" id="followers">0</div><div class="stat-label">Followers</div></div>
            <div class="stat-card"><div class="stat-number" id="following">0</div><div class="stat-label">Following</div></div>
        </div>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari project...">
        </div>
        <div class="filter-group">
            <button class="filter-btn active" data-filter="all">Semua</button>
            <button class="filter-btn" data-filter="featured">Featured</button>
            <button class="filter-btn" data-filter="web">Web App</button>
        </div>
    </div>

    <div class="info-bar">
        <span>📦 Menampilkan <strong id="displayCount">0</strong> project</span>
        <span>🔄 Klik file untuk langsung jalan</span>
    </div>

    <div class="projects-grid" id="projectsGrid">
        <div class="loading">⏳ Memuat daftar project...</div>
    </div>

    <footer>
        <p>© 2026 Zeen1146 • <a href="https://github.com/Zeen1146" target="_blank">GitHub Profile</a></p>
        <p style="margin-top: 8px;">✨ Klik file HTML untuk preview langsung</p>
    </footer>
</div>

<script>
    // Daftar file yang bisa diakses langsung (web apps)
    const webFiles = [
        { name: "QR Kode Generator", file: "QR%20kode%20generator%20V2.html", repo: "BYVOID", desc: "Generate QR code dengan mudah", icon: "📱" },
        { name: "Enkripsi Text", file: "enkripsi.html", repo: "BYVOID", desc: "Enkripsi dan dekripsi teks sederhana", icon: "🔐" },
        { name: "ID Generator", file: "id.html", repo: "BYVOID", desc: "Generate ID unik otomatis", icon: "🆔" },
        { name: "Matrix Video Effect", file: "matrix-video.html", repo: "BYVOID", desc: "Efek matrix keren dengan video", icon: "🎬" },
        { name: "Financial", file: "index.html", repo: "financial", desc: "Aplikasi pencatatan keuangan & target tabungan", icon: "💰" }
    ];

    const projects = [
        {
            name: "BYVOID",
            description: "Kumpulan project web tools: QR Generator, Enkripsi, ID Generator, Matrix Effect",
            url: "https://github.com/Zeen1146/BYVOID",
            language: "HTML/CSS/JS",
            stars: 0,
            forks: 0,
            featured: true,
            files: webFiles.filter(f => f.repo === "BYVOID")
        },
        {
            name: "financial",
            description: "Aplikasi pencatatan keuangan dan target tabungan dengan Rupiah",
            url: "https://github.com/Zeen1146/financial",
            language: "JavaScript",
            stars: 0,
            forks: 0,
            featured: true,
            files: webFiles.filter(f => f.repo === "financial")
        }
    ];

    let filteredProjects = [];
    let currentFilter = "all";
    let searchQuery = "";

    function applyFilters() {
        let filtered = [...projects];
        
        if (currentFilter === "featured") {
            filtered = filtered.filter(p => p.featured === true);
        } else if (currentFilter === "web") {
            filtered = filtered.filter(p => p.files.length > 0);
        }
        
        if (searchQuery.trim()) {
            const query = searchQuery.toLowerCase();
            filtered = filtered.filter(p => 
                p.name.toLowerCase().includes(query) ||
                (p.description && p.description.toLowerCase().includes(query))
            );
        }
        
        filteredProjects = filtered;
        document.getElementById('displayCount').innerText = filteredProjects.length;
        renderProjects();
    }

    function renderProjects() {
        const grid = document.getElementById('projectsGrid');
        
        if (filteredProjects.length === 0) {
            grid.innerHTML = '<div class="loading">📭 Tidak ada project yang sesuai</div>';
            return;
        }
        
        grid.innerHTML = filteredProjects.map(project => `
            <div class="project-card">
                <div class="project-name">
                    <a href="${project.url}" target="_blank">📁 ${project.name}</a>
                    <span style="background:#3b82f6; padding:2px 10px; border-radius:20px; font-size:0.65rem;">⭐ Featured</span>
                </div>
                <div class="project-desc">${project.description}</div>
                <div>
                    <span class="tech-tag">${project.language}</span>
                </div>
                <div class="file-list">
                    <h4>🚀 APPS (Klik untuk jalan):</h4>
                    ${project.files.map(file => `
                        <div class="file-item" onclick="openWebApp('${file.repo}', '${file.file}', '${file.name}')">
                            ${file.icon} ${file.name}
                        </div>
                    `).join('')}
                </div>
                <div class="project-stats">
                    <span>⭐ ${project.stars}</span>
                    <span>🔄 ${project.forks}</span>
                    <span>💻 ${project.language}</span>
                </div>
            </div>
        `).join('');
    }

    // Fungsi buka web app langsung
    function openWebApp(repo, fileName, appName) {
        // Karena repo BYVOID udah enable GitHub Pages, pake raw.githack biar langsung jalan
        const rawUrl = `https://raw.githack.com/Zeen1146/${repo}/main/${fileName}`;
        // Buka di tab baru
        window.open(rawUrl, '_blank');
    }

    function initEventListeners() {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                applyFilters();
            });
        });
        
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            applyFilters();
        });
    }

    initEventListeners();
    applyFilters();
</script>
</body>
    </html>
