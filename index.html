<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Directory Launcher - GitHub Pages</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      max-width: 600px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease-in-out;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      background-color: var(--card-hover);
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .card-icon {
      font-size: 1.5rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      word-break: break-word;
    }

    .card-footer {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
    }

    .status {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .error-msg {
      color: #f87171;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="repo-title">Web Projects</h1>
    <p>Pilih halaman web di bawah ini untuk membukanya langsung.</p>
  </header>

  <main class="container">
    <div id="status" class="status">Memuat daftar file...</div>
    <div id="file-grid" class="grid" style="display: none;"></div>
  </main>

  <script>
    // Deteksi otomatis Username & Repository
    const username = "By-Void-X";
    const repository = "folder-html";

    async function fetchItems() {
      const statusEl = document.getElementById('status');
      const gridEl = document.getElementById('file-grid');
      const apiUrl = `https://api.github.com/repos/${username}/${repository}/contents`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('Gagal mengambil data dari GitHub API');

        const items = await response.json();
        
        // Mengambil folder (dir) ATAU file dengan ekstensi .html (kecuali index.html)
        const validItems = items.filter(item => {
          if (item.type === 'dir' && !item.name.startsWith('.')) return true;
          if (item.type === 'file' && item.name.endsWith('.html') && item.name.toLowerCase() !== 'index.html') return true;
          return false;
        });

        if (validItems.length === 0) {
          statusEl.textContent = 'Tidak ada file HTML atau folder yang ditemukan.';
          return;
        }

        statusEl.style.display = 'none';
        gridEl.style.display = 'grid';

        validItems.forEach(item => {
          const card = document.createElement('a');
          card.className = 'card';
          
          // Tentukan path tautan dan ikon
          const isDir = item.type === 'dir';
          card.href = `./${item.name}`;
          
          // Merapikan tampilan nama (menghapus .html dari judul jika berupa file)
          const displayName = isDir ? item.name : item.name.replace(/\.html$/i, '');
          const icon = isDir ? '📁' : '🌐';

          card.innerHTML = `
            <div>
              <div class="card-header">
                <span class="card-icon">${icon}</span>
                <span class="card-title">${displayName}</span>
              </div>
            </div>
            <div class="card-footer">
              <span>Buka ${isDir ? 'Folder' : 'Halaman'}</span>
              <span>&rarr;</span>
            </div>
          `;

          gridEl.appendChild(card);
        });

      } catch (err) {
        statusEl.innerHTML = `<span class="error-msg">Error: ${err.message}</span>`;
      }
    }

    fetchItems();
  </script>
</body>
</html>
