<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByVoid Labs | Nexus Project Hub</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #03060c);
            font-family: 'Segoe UI', 'Poppins', monospace;
            color: #eaeef5;
            padding: 25px;
            min-height: 100vh;
        }

        /* Gaya scrollbar kustom */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #11161f;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #00ffcc;
            border-radius: 10px;
        }

        /* Header + tombol github */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
            background: rgba(0, 20, 30, 0.6);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 60px;
            border: 1px solid #00ffcc33;
        }
        .title-section h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #00ffcc, #ff66cc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }
        .title-section p {
            font-size: 12px;
            color: #9aa7c4;
        }
        .github-btn {
            background: #1e2a3a;
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #00ffcc88;
            transition: 0.2s;
        }
        .github-btn:hover {
            background: #00ffcc22;
            border-color: #00ffcc;
            color: #00ffcc;
            transform: scale(1.02);
            box-shadow: 0 0 12px #00ffcc66;
        }

        /* Layout utama: 2 kolom */
        .app-wrapper {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        /* Sidebar kiri - daftar project */
        .sidebar {
            flex: 1.2;
            min-width: 280px;
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 20px;
            border: 1px solid #2d3e5f;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            height: fit-content;
        }
        .sidebar h2 {
            font-size: 1.5rem;
            border-left: 5px solid #00ffcc;
            padding-left: 15px;
            margin-bottom: 20px;
        }
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .project-card-side {
            background: #0f1422cc;
            border-radius: 20px;
            padding: 12px 15px;
            transition: all 0.2s ease;
            border: 1px solid #2a3450;
        }
        .project-card-side:hover {
            background: #1a2340;
            border-color: #00ffcc;
            transform: translateX(5px);
        }
        .project-name {
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            color: #bbd9ff;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 5px;
        }
        .btn-preview {
            background: #1e2f3f;
            border: none;
            color: #9efff0;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 11px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.1s;
        }
        .btn-tab {
            background: #2a1e3f;
            border: none;
            color: #e0aaff;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 11px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .btn-preview:hover, .btn-tab:hover {
            filter: brightness(1.2);
            transform: scale(0.96);
        }

        /* Area kanan: Live Preview */
        .main-content {
            flex: 2.5;
            min-width: 480px;
            background: rgba(8, 12, 22, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 20px;
            border: 1px solid #2d3e5f;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .preview-header h3 {
            color: #00ffcc;
            font-size: 1.3rem;
        }
        .reset-btn {
            background: #2f2a44;
            border: none;
            padding: 5px 15px;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            font-size: 12px;
        }
        .iframe-container {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 0 0 2px #00ffcc33, 0 10px 30px black;
        }
        iframe {
            width: 100%;
            height: 580px;
            border: none;
            display: block;
        }
        .placeholder {
            text-align: center;
            padding: 80px 20px;
            background: #0b1020;
            border-radius: 24px;
            color: #aaa;
        }

        @media (max-width: 800px) {
            .app-wrapper { flex-direction: column; }
            .main-content { min-width: auto; }
            iframe { height: 450px; }
        }
    </style>
</head>
<body>

<div class="top-header">
    <div class="title-section">
        <h1><i class="fas fa-cube"></i> ByVoid Nexus</h1>
        <p>jalankan project HTML langsung · dua aksi: Preview atau Buka Tab</p>
    </div>
    <a href="https://github.com/Zeen1146/BYVOID" target="_blank" class="github-btn">
        <i class="fab fa-github"></i> GitHub Repo →
    </a>
</div>

<div class="app-wrapper">
    <!-- SIDEBAR KIRI: Daftar Project -->
    <div class="sidebar">
        <h2><i class="fas fa-code-branch"></i> Project Archive</h2>
        <div id="project-list-sidebar" class="project-list">
            Loading project dari GitHub...
        </div>
    </div>

    <!-- KANAN: Area Live Preview -->
    <div class="main-content">
        <div class="preview-header">
            <h3><i class="fas fa-eye"></i> Live Sandbox</h3>
            <button id="resetPreviewBtn" class="reset-btn"><i class="fas fa-undo-alt"></i> Bersihkan Preview</button>
        </div>
        <div id="previewArea">
            <div class="placeholder">
                <i class="fas fa-mouse-pointer" style="font-size: 40px; opacity: 0.6;"></i>
                <p style="margin-top: 15px;">Pilih project dari kiri.<br>Tekan <strong>▶ Preview</strong> untuk mencoba di sini.<br>Atau <strong>🔗 Buka Tab</strong> untuk layar penuh terpisah.</p>
            </div>
        </div>
    </div>
</div>

<script>
    const owner = "Zeen1146";
    const repo = "BYVOID";
    const pageBase = `https://${owner}.github.io/${repo}/`;

    async function loadProjects() {
        const container = document.getElementById("project-list-sidebar");
        try {
            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`);
            const files = await res.json();
            const htmlFiles = files.filter(f => f.type === "file" && f.name.endsWith(".html"));
            
            if (htmlFiles.length === 0) {
                container.innerHTML = "<p>Tidak ada file HTML.</p>";
                return;
            }

            let sidebarHtml = "";
            htmlFiles.forEach(file => {
                const fileName = file.name;
                const displayName = fileName.replace(".html", "");
                const fullUrl = pageBase + encodeURIComponent(fileName);
                
                sidebarHtml += `
                    <div class="project-card-side" data-url="${fullUrl}">
                        <div class="project-name">
                            <i class="fas fa-file-code"></i> ${displayName}
                        </div>
                        <div class="button-group">
                            <button class="btn-preview" data-url="${fullUrl}">
                                <i class="fas fa-play"></i> Preview Live
                            </button>
                            <a href="${fullUrl}" target="_blank" class="btn-tab">
                                <i class="fas fa-external-link-alt"></i> Buka Tab Baru
                            </a>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = sidebarHtml;

            // Pasang event listener untuk semua tombol Preview
            document.querySelectorAll(".btn-preview").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const url = btn.getAttribute("data-url");
                    showPreview(url);
                });
            });
        } catch (err) {
            container.innerHTML = `<p>Error: ${err.message}</p>`;
        }
    }

    function showPreview(url) {
        const previewArea = document.getElementById("previewArea");
        previewArea.innerHTML = `
            <div class="iframe-container">
                <iframe src="${url}" title="Live preview project" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals"></iframe>
            </div>
        `;
    }

    // Reset Preview (kembalikan ke placeholder)
    document.getElementById("resetPreviewBtn").addEventListener("click", () => {
        document.getElementById("previewArea").innerHTML = `
            <div class="placeholder">
                <i class="fas fa-mouse-pointer" style="font-size: 40px; opacity: 0.6;"></i>
                <p style="margin-top: 15px;">Pilih project dari kiri.<br>Tekan <strong>▶ Preview</strong> untuk mencoba di sini.<br>Atau <strong>🔗 Buka Tab</strong> untuk layar penuh terpisah.</p>
            </div>
        `;
    });

    loadProjects();
</script>
</body>
</html>
