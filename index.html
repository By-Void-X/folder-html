<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Directory Launcher - GitHub Pages</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      max-width: 600px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease-in-out;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      background-color: var(--card-hover);
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .card-icon {
      font-size: 1.5rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      word-break: break-word;
    }

    .card-footer {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
    }

    .status {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .error-msg {
      color: #f87171;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="repo-title">Projects Directory</h1>
    <p>Pilih folder di bawah ini untuk membuka halaman web target.</p>
  </header>

  <main class="container">
    <div id="status" class="status">Memuat daftar folder...</div>
    <div id="folder-grid" class="grid" style="display: none;"></div>
  </main>

  <script>
    // Konfigurasi Otomatis berdasarkan URL GitHub Pages
    // URL Format: https://USERNAME.github.io/REPOSITORY_NAME/
    const hostParts = window.location.hostname.split('.');
    const pathParts = window.location.pathname.split('/').filter(p => p.length > 0);

    let username = hostParts[0];
    let repository = pathParts[0] || '';

    // Kustomisasi manual jika dijalankan di localhost atau custom domain:
    // const username = "USERNAME_GITHUB_KAMU";
    // const repository = "NAMA_REPO_KAMU";

    document.getElementById('repo-title').textContent = repository ? `${repository} Directory` : 'Projects Directory';

    async function fetchFolders() {
      const statusEl = document.getElementById('status');
      const gridEl = document.getElementById('folder-grid');

      if (!username || !repository) {
        statusEl.innerHTML = `<span class="error-msg">Gagal mendeteksi informasi repository. Jika menggunakan custom domain, isi variabel <b>username</b> dan <b>repository</b> di dalam file HTML secara manual.</span>`;
        return;
      }

      const apiUrl = `https://api.github.com/repos/${username}/${repository}/contents`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('Gagal mengambil data dari GitHub API');

        const items = await response.json();
        
        // Filter item yang berjenis folder (dir) dan mengabaikan folder tersembunyi (awalan titik)
        const folders = items.filter(item => item.type === 'dir' && !item.name.startsWith('.'));

        if (folders.length === 0) {
          statusEl.textContent = 'Tidak ada folder project yang ditemukan di repository ini.';
          return;
        }

        statusEl.style.display = 'none';
        gridEl.style.display = 'grid';

        folders.forEach(folder => {
          const card = document.createElement('a');
          card.className = 'card';
          // Mengarahkan langsung ke folder (misal: ./nama-folder/)
          card.href = `./${folder.name}/`;

          card.innerHTML = `
            <div>
              <div class="card-header">
                <span class="card-icon">📁</span>
                <span class="card-title">${folder.name}</span>
              </div>
            </div>
            <div class="card-footer">
              <span>Buka Web Page</span>
              <span>&rarr;</span>
            </div>
          `;

          gridEl.appendChild(card);
        });

      } catch (err) {
        statusEl.innerHTML = `<span class="error-msg">Error: ${err.message}. Pastikan repository bersifat Public.</span>`;
      }
    }

    fetchFolders();
  </script>
</body>
</html>
