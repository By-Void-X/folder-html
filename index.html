<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeen1146 | GitHub Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e5e5e5; padding: 40px 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #3b82f6; margin-bottom: 20px; object-fit: cover; }
        h1 { font-size: 2rem; margin-bottom: 10px; background: linear-gradient(135deg, #fff, #3b82f6); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .bio { color: #888; margin-bottom: 20px; }
        .stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 40px; flex-wrap: wrap; }
        .stat-card { background: #1a1a1a; padding: 12px 24px; border-radius: 40px; border: 1px solid #333; }
        .stat-number { font-size: 1.8rem; font-weight: bold; color: #3b82f6; }
        .stat-label { font-size: 0.8rem; color: #888; }
        .controls { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; margin-bottom: 30px; }
        .search-box input { padding: 12px 20px; background: #1a1a1a; border: 1px solid #333; border-radius: 40px; color: white; width: 250px; outline: none; }
        .search-box input:focus { border-color: #3b82f6; }
        .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-btn { background: #1a1a1a; border: 1px solid #333; padding: 8px 20px; border-radius: 40px; color: #ccc; cursor: pointer; }
        .filter-btn.active, .filter-btn:hover { background: #3b82f6; color: white; border-color: #3b82f6; }
        .info-bar { background: #111; border-radius: 16px; padding: 12px 20px; margin-bottom: 24px; display: flex; justify-content: space-between; flex-wrap: wrap; font-size: 0.85rem; color: #888; border: 1px solid #333; }
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-top: 20px; }
        .project-card { background: #111; border: 1px solid #333; border-radius: 20px; padding: 20px; transition: 0.2s; }
        .project-card:hover { border-color: #3b82f6; transform: translateY(-3px); }
        .project-name { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
        .project-name a { color: white; text-decoration: none; }
        .project-name a:hover { color: #3b82f6; }
        .project-desc { color: #999; font-size: 0.85rem; margin: 10px 0; line-height: 1.5; }
        .tech-tag { background: #1e1e1e; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; color: #3b82f6; display: inline-block; margin-right: 6px; margin-bottom: 6px; border: 1px solid #2a2a2a; }
        .project-stats { display: flex; gap: 15px; margin-top: 12px; font-size: 0.75rem; color: #666; }
        .loading, .error { text-align: center; padding: 60px; color: #888; }
        .error { color: #ef4444; }
        footer { text-align: center; margin-top: 50px; padding-top: 30px; border-top: 1px solid #2a2a2a; color: #666; font-size: 0.8rem; }
        footer a { color: #3b82f6; text-decoration: none; }
        @media (max-width: 640px) {
            .controls { flex-direction: column; }
            .search-box input { width: 100%; }
            .projects-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img class="avatar" id="avatar" src="https://avatars.githubusercontent.com/u/186116108?v=4" alt="avatar">
        <h1 id="username">Zeen1146</h1>
        <p class="bio" id="bio">Developer | Loading profile...</p>
        <div class="stats" id="stats">
            <div class="stat-card"><div class="stat-number" id="repoCount">-</div><div class="stat-label">Repositori</div></div>
            <div class="stat-card"><div class="stat-number" id="followers">-</div><div class="stat-label">Followers</div></div>
            <div class="stat-card"><div class="stat-number" id="following">-</div><div class="stat-label">Following</div></div>
        </div>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari project...">
        </div>
        <div class="filter-group">
            <button class="filter-btn active" data-filter="all">Semua</button>
            <button class="filter-btn" data-filter="featured">Featured</button>
            <button class="filter-btn" data-filter="HTML">HTML</button>
            <button class="filter-btn" data-filter="JavaScript">JavaScript</button>
        </div>
    </div>

    <div class="info-bar">
        <span>📦 Menampilkan <strong id="displayCount">0</strong> dari <span id="totalCount">0</span> project</span>
        <span>🔄 Auto-sync dari GitHub</span>
    </div>

    <div class="projects-grid" id="projectsGrid">
        <div class="loading">⏳ Memuat data dari GitHub API...</div>
    </div>

    <footer>
        <p>© 2026 Zeen1146 • <a href="https://github.com/Zeen1146" target="_blank">GitHub Profile</a></p>
        <p style="margin-top: 8px;">🚀 Semua repository otomatis tersinkronasi</p>
    </footer>
</div>

<script>
    const GITHUB_USERNAME = "Zeen1146";
    
    let allRepos = [];
    let filteredRepos = [];
    let currentFilter = "all";
    let searchQuery = "";

    async function fetchGitHub(endpoint) {
        const response = await fetch(`https://api.github.com/${endpoint}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
    }

    async function loadPortfolio() {
        try {
            // Ambil data user
            const userData = await fetchGitHub(`users/${GITHUB_USERNAME}`);
            document.getElementById('avatar').src = userData.avatar_url;
            document.getElementById('username').innerHTML = userData.name || userData.login;
            document.getElementById('bio').innerHTML = userData.bio || `${userData.login} — Developer portfolio auto-sync dari GitHub`;
            document.getElementById('repoCount').innerText = userData.public_repos;
            document.getElementById('followers').innerText = userData.followers;
            document.getElementById('following').innerText = userData.following;

            // Ambil daftar repo
            const reposData = await fetchGitHub(`users/${GITHUB_USERNAME}/repos?sort=updated&per_page=100`);
            
            allRepos = reposData.map(repo => ({
                id: repo.id,
                name: repo.name,
                description: repo.description || "Tidak ada deskripsi",
                html_url: repo.html_url,
                homepage: repo.homepage,
                language: repo.language || "Other",
                stargazers_count: repo.stargazers_count,
                forks_count: repo.forks_count,
                updated_at: repo.updated_at,
                isFeatured: repo.name === "BYVOID" || repo.name === "financial" // Mark BYVOID & financial as featured
            }));

            // Urutkan: featured dulu, lalu berdasarkan update terbaru
            allRepos.sort((a, b) => {
                if (a.isFeatured !== b.isFeatured) return a.isFeatured ? -1 : 1;
                return new Date(b.updated_at) - new Date(a.updated_at);
            });
            
            applyFilters();
        } catch (error) {
            console.error(error);
            document.getElementById('projectsGrid').innerHTML = `
                <div class="error">
                    ❌ Gagal mengambil data dari GitHub API<br>
                    <small>${error.message}</small><br><br>
                    💡 Coba refresh halaman
                </div>
            `;
        }
    }

    function applyFilters() {
        let filtered = [...allRepos];
        
        if (currentFilter !== "all" && currentFilter !== "featured") {
            filtered = filtered.filter(repo => repo.language === currentFilter);
        } else if (currentFilter === "featured") {
            filtered = filtered.filter(repo => repo.isFeatured === true);
        }
        
        if (searchQuery.trim()) {
            const query = searchQuery.toLowerCase();
            filtered = filtered.filter(repo => 
                repo.name.toLowerCase().includes(query) ||
                (repo.description && repo.description.toLowerCase().includes(query)) ||
                (repo.language && repo.language.toLowerCase().includes(query))
            );
        }
        
        filteredRepos = filtered;
        document.getElementById('displayCount').innerText = filteredRepos.length;
        document.getElementById('totalCount').innerText = allRepos.length;
        renderProjects();
    }

    function renderProjects() {
        const grid = document.getElementById('projectsGrid');
        
        if (filteredRepos.length === 0) {
            grid.innerHTML = `<div class="loading">📭 Tidak ada project yang sesuai</div>`;
            return;
        }
        
        grid.innerHTML = filteredRepos.map(repo => `
            <div class="project-card">
                <div class="project-name">
                    <a href="${repo.html_url}" target="_blank">📁 ${escapeHtml(repo.name)}</a>
                    ${repo.isFeatured ? '<span style="background:#3b82f6; padding:2px 10px; border-radius:20px; font-size:0.65rem;">⭐ Featured</span>' : ''}
                </div>
                <div class="project-desc">${escapeHtml(repo.description)}</div>
                <div>
                    ${repo.language !== "Other" ? `<span class="tech-tag">${escapeHtml(repo.language)}</span>` : ''}
                </div>
                <div class="project-stats">
                    <span>⭐ ${repo.stargazers_count}</span>
                    <span>🔄 ${repo.forks_count}</span>
                    <span>📅 ${formatDate(repo.updated_at)}</span>
                </div>
            </div>
        `).join('');
    }

    function formatDate(dateStr) {
        const date = new Date(dateStr);
        const now = new Date();
        const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));
        if (diffDays < 1) return 'Hari ini';
        if (diffDays < 7) return `${diffDays} hari lalu`;
        if (diffDays < 30) return `${Math.floor(diffDays / 7)} minggu lalu`;
        return date.toLocaleDateString('id-ID', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function initEventListeners() {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                applyFilters();
            });
        });
        
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            applyFilters();
        });
    }

    initEventListeners();
    loadPortfolio();
</script>
</body>
    </html>
