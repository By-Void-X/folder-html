<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peredam HD - Akun Fake Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { color: #3b5998; margin-top: 0; } /* Warna khas FB lama */
        p { color: #aaa; font-size: 14px; }
        .upload-btn {
            display: inline-block;
            background-color: #3b5998;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 20px 0;
            font-weight: bold;
        }
        .upload-btn:hover { background-color: #2d4373; }
        input[type="file"] { display: none; }
        .preview-box {
            margin-top: 20px;
            display: none;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 2px solid #333;
        }
        .download-btn {
            display: inline-block;
            background-color: #25d366;
            color: white;
            padding: 10px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }
        .download-btn:hover { background-color: #1ebd5c; }
    </style>
</head>
<body>

<div class="container">
    <h2>📉 Penurunan Resolusi Foto</h2>
    <p>Upload foto di sini biar kualitasnya turun rapi dan kelihatan burik atau kualitas turun.</p>
    
    <label class="upload-btn">
        Pilih Foto Asli
        <input type="file" id="imageInput" accept="image/*">
    </label>

    <div class="preview-box" id="previewBox">
        <h3>Hasil Convert (Vibe Akun Real):</h3>
        <img id="resultImage" src="#" alt="Hasil Kurang HD">
        <br>
        <a id="downloadLink" class="download-btn" download="rabin_shrestha_natural.jpg">Download Foto</a>
    </div>
</div>

<script>
    document.getElementById('imageInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // Trik utama: Paksa ukuran maksimal lebar/tinggi cuma 600 pixel
                // Ini bikin detail tajamnya hilang pas di-resize
                const MAX_WIDTH = 600;
                const MAX_HEIGHT = 600;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                } else {
                    if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height;
                        height = MAX_HEIGHT;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);

                // Trik kedua: Set kualitas output JPEG ke 0.4 (40% kualitas asli)
                // Ini bakal ngasih efek kompresi halus khas upload-an sosmed
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.4);

                // Tampilkan hasil
                const resultImage = document.getElementById('resultImage');
                const downloadLink = document.getElementById('downloadLink');
                const previewBox = document.getElementById('previewBox');

                resultImage.src = compressedDataUrl;
                downloadLink.href = compressedDataUrl;
                previewBox.style.display = 'block';
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    });
</script>

</body>
</html>
