<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Minecraft Stack Tools | ByVoid - Dengan Riwayat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a1f0a;
            font-family: 'Segoe UI', 'Poppins', monospace;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .card {
            max-width: 900px;
            width: 100%;
            background: #0c1a0c;
            border-radius: 32px;
            padding: 24px;
            border: 2px solid #5f9e6e;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            position: relative;
        }
        /* Tombol setting pojok kanan atas */
        .settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #2a4a2a;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            color: #aaffaa;
        }
        .settings-btn:hover {
            background: #4a8a4a;
            transform: rotate(30deg);
        }
        h1 {
            text-align: center;
            color: #e0ffc0;
            text-shadow: 2px 2px 0 #2a6a2a;
            margin-bottom: 8px;
            font-size: 1.9rem;
            padding-right: 50px;
        }
        .sub {
            text-align: center;
            color: #c0e0c0;
            margin-bottom: 24px;
            font-size: 0.85rem;
        }
        textarea {
            width: 100%;
            padding: 16px;
            background: #f5f5e0;
            border: 2px solid #6fa86f;
            border-radius: 20px;
            color: #1a2a1a;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            resize: vertical;
            margin-bottom: 16px;
        }
        button {
            background: #6fbf4c;
            border: none;
            padding: 14px 24px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            margin-bottom: 24px;
            color: #0a2a0a;
        }
        button:hover {
            background: #a0ff70;
            transform: scale(0.98);
        }
        .result-container {
            background: #061206;
            border-radius: 24px;
            padding: 16px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Segoe UI', monospace;
        }
        th {
            background: #2f6a2f;
            color: #ffffff;
            padding: 12px 8px;
            text-align: left;
            font-weight: bold;
            border-bottom: 2px solid #a0d8a0;
        }
        td {
            padding: 10px 8px;
            color: #eef5ee;
            font-weight: 500;
            border-bottom: 1px solid #2c5a2c;
        }
        tr:nth-child(even) {
            background-color: #0e2a0e;
        }
        tr:nth-child(odd) {
            background-color: #0a1f0a;
        }
        .total-badge {
            background: #3a7a3a;
            padding: 4px 10px;
            border-radius: 40px;
            font-weight: bold;
            color: #f0fff0;
            display: inline-block;
        }
        .stack-value {
            color: #ffd966;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .sisa-value {
            color: #bbffbb;
            font-weight: bold;
        }
        .error {
            background: #5a2a2a;
            color: #ffc0c0;
            padding: 14px;
            border-radius: 24px;
            text-align: center;
            font-weight: bold;
            margin-top: 16px;
        }
        footer {
            text-align: center;
            font-size: 11px;
            margin-top: 20px;
            color: #9ac99a;
        }
        .info-note {
            background: #1e3a1e;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 16px;
            color: #c0e0c0;
            text-align: center;
        }
        /* Modal Pengaturan + Riwayat */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #0c1a0c;
            border: 2px solid #5f9e6e;
            border-radius: 32px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 80%;
            overflow-y: auto;
        }
        .modal-content h3 {
            color: #e0ffc0;
            margin-bottom: 16px;
        }
        .history-list {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 16px;
        }
        .history-item {
            background: #1e2a1e;
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.1s;
        }
        .history-item:hover {
            background: #3a5a3a;
        }
        .history-time {
            font-size: 10px;
            color: #aaffaa;
            margin-bottom: 6px;
        }
        .history-preview {
            font-size: 11px;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .modal-btn {
            background: #4a6a4a;
            padding: 10px;
            margin-top: 8px;
            font-size: 14px;
        }
        .close-modal {
            background: #6a2a2a;
        }
        .clear-history {
            background: #8a4a4a;
        }
    </style>
</head>
<body>

<div class="card">
    <button class="settings-btn" id="settingsBtn">⚙️</button>
    <h1>⛏️ Stack Crafter ⚡</h1>
    <div class="sub">1 stack = 64 block · auto-save riwayat</div>

    <textarea id="materialInput" rows="8" placeholder="Contoh format:
5330-BuildingBlock
4635 GlassBlock
1787-OakLog
1040 DirtBlock"></textarea>

    <button id="calculateBtn">📦 Hitung Stack Sekarang</button>

    <div id="resultArea" style="display: none;">
        <h3>📋 Hasil Perhitungan <span style="font-size:14px;">(1 stack = 64 block)</span></h3>
        <div class="result-container">
            <table id="resultTable">
                <thead><tr><th>🧱 Item</th><th>📦 Total</th><th>📚 Stack</th><th>🔹 Sisa Block</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="info-note">💡 Data otomatis tersimpan di riwayat (⚙️ pojok kanan atas)</div>
    </div>
    <div id="errorMsg" class="error" style="display: none;"></div>
    <footer>ByVoid Labs · riwayat tidak akan hilang meskipun refresh</footer>
</div>

<!-- Modal Riwayat & Pengaturan -->
<div id="historyModal" class="modal">
    <div class="modal-content">
        <h3>📜 Riwayat Perhitungan</h3>
        <div id="historyList" class="history-list">
            <p style="color:#aaa;">Belum ada riwayat</p>
        </div>
        <button id="clearHistoryBtn" class="modal-btn clear-history">🗑️ Hapus Semua Riwayat</button>
        <button id="closeModalBtn" class="modal-btn close-modal">❌ Tutup</button>
    </div>
</div>

<script>
    // DOM elements
    const textarea = document.getElementById('materialInput');
    const calculateBtn = document.getElementById('calculateBtn');
    const resultArea = document.getElementById('resultArea');
    const tableBody = document.getElementById('tableBody');
    const errorMsgDiv = document.getElementById('errorMsg');
    const settingsBtn = document.getElementById('settingsBtn');
    const historyModal = document.getElementById('historyModal');
    const historyListDiv = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');

    // Data riwayat
    let history = [];

    // Load dari localStorage saat halaman dimuat
    function loadHistory() {
        const saved = localStorage.getItem('minecraft_stack_history');
        if (saved) {
            try {
                history = JSON.parse(saved);
                renderHistoryList();
            } catch(e) { console.error(e); }
        }
        // Load terakhir yang dihitung (last result)
        const lastInput = localStorage.getItem('minecraft_last_input');
        const lastResult = localStorage.getItem('minecraft_last_result');
        if (lastInput && lastResult) {
            textarea.value = lastInput;
            const items = JSON.parse(lastResult);
            renderTable(items);
            resultArea.style.display = "block";
        }
    }

    // Simpan riwayat ke localStorage
    function saveHistory() {
        localStorage.setItem('minecraft_stack_history', JSON.stringify(history));
    }

    // Simpan input terakhir
    function saveLastInput(input, resultItems) {
        localStorage.setItem('minecraft_last_input', input);
        localStorage.setItem('minecraft_last_result', JSON.stringify(resultItems));
    }

    // Tambahkan riwayat baru
    function addToHistory(rawText, itemsWithStack) {
        const timestamp = new Date().toLocaleString('id-ID');
        const preview = itemsWithStack.slice(0, 3).map(i => `${i.nama}: ${i.stack}st`).join(', ');
        const historyItem = {
            id: Date.now(),
            timestamp,
            rawText,
            items: itemsWithStack,
            preview: preview + (itemsWithStack.length > 3 ? ', ...' : '')
        };
        history.unshift(historyItem); // tambah di awal
        if (history.length > 10) history = history.slice(0, 10); // max 10 riwayat
        saveHistory();
        renderHistoryList();
    }

    // Render daftar riwayat di modal
    function renderHistoryList() {
        if (history.length === 0) {
            historyListDiv.innerHTML = '<p style="color:#aaa;">Belum ada riwayat</p>';
            return;
        }
        let html = '';
        for (let item of history) {
            html += `
                <div class="history-item" data-id="${item.id}">
                    <div class="history-time">🕒 ${item.timestamp}</div>
                    <div class="history-preview">📦 ${item.preview}</div>
                </div>
            `;
        }
        historyListDiv.innerHTML = html;
        // Pasang event listener ke setiap history item
        document.querySelectorAll('.history-item').forEach(el => {
            el.addEventListener('click', () => {
                const id = parseInt(el.getAttribute('data-id'));
                const found = history.find(h => h.id === id);
                if (found) {
                    textarea.value = found.rawText;
                    renderTable(found.items);
                    resultArea.style.display = "block";
                    historyModal.style.display = "none";
                    // Simpan ke last input juga
                    localStorage.setItem('minecraft_last_input', found.rawText);
                    localStorage.setItem('minecraft_last_result', JSON.stringify(found.items));
                }
            });
        });
    }

    // Hapus semua riwayat
    function clearHistory() {
        history = [];
        saveHistory();
        localStorage.removeItem('minecraft_last_input');
        localStorage.removeItem('minecraft_last_result');
        renderHistoryList();
        resultArea.style.display = "none";
        textarea.value = "";
        errorMsgDiv.style.display = "none";
    }

    // --- PARSING & RENDER (sama seperti sebelumnya) ---
    function parseMaterials(rawText) {
        const lines = rawText.split(/\r?\n/);
        const items = [];
        for (let line of lines) {
            line = line.trim();
            if (line === "") continue;
            let match = line.match(/^(\d+)[\s\-]+(.+)$/);
            if (match) {
                items.push({ jumlah: parseInt(match[1]), nama: match[2].trim() });
            } else {
                let matchReverse = line.match(/^(.+?)[\s\-]+(\d+)$/);
                if (matchReverse) {
                    items.push({ jumlah: parseInt(matchReverse[2]), nama: matchReverse[1].trim() });
                }
            }
        }
        return items;
    }

    function calculateStacks(items) {
        return items.map(item => ({
            ...item,
            stack: Math.floor(item.jumlah / 64),
            sisa: item.jumlah % 64
        }));
    }

    function renderTable(itemsWithStack) {
        tableBody.innerHTML = "";
        for (let item of itemsWithStack) {
            const row = tableBody.insertRow();
            row.insertCell(0).innerText = item.nama;
            row.insertCell(1).innerHTML = `<span class="total-badge">${item.jumlah}</span>`;
            row.insertCell(2).innerHTML = `<span class="stack-value">${item.stack}</span> stack`;
            row.insertCell(3).innerHTML = `<span class="sisa-value">${item.sisa} block</span>`;
        }
    }

    function showError(msg) {
        errorMsgDiv.innerText = msg;
        errorMsgDiv.style.display = "block";
        resultArea.style.display = "none";
        setTimeout(() => errorMsgDiv.style.display = "none", 4000);
    }

    // Event utama: Hitung Stack
    calculateBtn.addEventListener('click', () => {
        const raw = textarea.value;
        if (!raw.trim()) {
            showError("❌ Masukkan atau paste daftar bahan terlebih dahulu.");
            return;
        }
        const items = parseMaterials(raw);
        if (items.length === 0) {
            showError("⚠️ Tidak ada data valid. Format: angka-namaItem");
            return;
        }
        const result = calculateStacks(items);
        renderTable(result);
        resultArea.style.display = "block";
        // Simpan ke riwayat
        addToHistory(raw, result);
        saveLastInput(raw, result);
    });

    // Modal settings
    settingsBtn.addEventListener('click', () => {
        renderHistoryList();
        historyModal.style.display = 'flex';
    });
    closeModalBtn.addEventListener('click', () => {
        historyModal.style.display = 'none';
    });
    clearHistoryBtn.addEventListener('click', () => {
        if (confirm('Hapus semua riwayat? Data tidak bisa dikembalikan.')) {
            clearHistory();
        }
    });
    // Tutup modal klik di luar
    window.addEventListener('click', (e) => {
        if (e.target === historyModal) historyModal.style.display = 'none';
    });

    // Load data saat halaman dimuat
    loadHistory();
</script>
</body>
</html>
